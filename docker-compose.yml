version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - esport-net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '3001:3000'   # 3001 côté host, 3000 dans le conteneur Node
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - esport-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_server
    env_file:
      - .env
    ports:
      - '1433:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      retries: 20
      start_period: 60s
      timeout: 5s
    networks:
      - esport-net

volumes:
  sqlserver_data:

networks:
  esport-net:
    driver: bridge
