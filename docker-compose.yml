version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_server
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'yourStrong(!)Password'
    ports:
      - '1433:1433'
    volumes:
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
